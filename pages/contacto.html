              >Contacto</a
            >

        </ul>
      </nav>
    </header>

    <main class="main" id="contenido-principal">
      <section class="container d-flex mt-3 mb-3 flex-column align-items-center py-5 border border-2 border-secondary-subtle rounded w-75 shadow-sm">
        <h1>Envianos tu mensaje</h1>
        <p>
          ¿Tenés alguna duda o consulta? Escribenos y te responderemos a la
          brevedad.
        </p>

        <form class="contacto-form mt-4" action="#" method="POST">
          <div class="mb-1">
            <label for="nombre" class="form-label">Nombre completo</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              required
              placeholder="Tu nombre..."
              class="form-control"
            />
          </div>

          <div class="mb-1">
            <label for="email" class="form-label">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="Tu email..."
              class="form-control"
            />
          </div>

          <div class="mb-1">
            <label for="asunto" class="form-label">Asunto</label>
            <select id="asunto" name="asunto" class="form-control" required>
              <option value="consulta">Consulta general</option>
              <option value="pedido">Estado de mi pedido</option>
              <option value="devolucion">Devoluciones</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="mb-1">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              required
              class="form-control"
              placeholder="Escribí tu mensaje aquí..."
            ></textarea>
          </div>
          <div class="mb-1 form-check">
            <input
              type="checkbox"
              id="conformidad"
              name="conformidad"
              required
              class="form-check-input"
            />
            <label for="conformidad" class="form-check-label">Acepto los términos y condiciones</label>
          </div>

          <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>
      </section>
    </main>

    <footer class="bg-dark text-light text-center border-bottom border-1 border-secondary-subtle p-3">
      <p>Todos los derechos reservados</p>
      <p>Contacto: tienda@katclothes.com.ar</p>
      <div class="redes-sociales">
        <a href="#" class="text-decoration-none text-warning">Facebook</a>
        |

        |
        <a href="#" class="text-decoration-none text-warning">Tiktok</a>
      </div>
    </footer>
