<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />

    <link rel="stylesheet" href="../estilos.css" />
    <link rel="stylesheet" href="../responsive.css" />
    <title>Contacto | TIENDA DE ABRIGOS</title>
  </head>
  <body>
    <a href="#contenido-principal" class="sr-only"
      >Saltar al contenido principal</a
    >
    <header class="header">
      <span class="header_logo"><strong>KAT</strong> CLOTHES</span>
      <nav class="header_nav">
        <ul class="header_nav-ul">
          <li class="">
            <a class="nav_ul-a" href="../index.html">Inicio</a>
          </li>
          <li class="">
            <a class="nav_ul-a" href="producto.html">Productos</a>
          </li>
          <li class="">
            <a class="nav_ul-a" href="nosotros.html">Nosotros</a>
          </li>
          <li class="">
            <a class="nav_ul-a" href="contacto.html" aria-current="page"
              >Contacto</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main class="main" id="contenido-principal">
      <section class="contacto-seccion">
        <h1>Envianos tu mensaje</h1>
        <p>
          ¿Tenés alguna duda o consulta? Escribenos y te responderemos a la
          brevedad.
        </p>

        <form class="contacto-form" action="#" method="POST">
          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              required
              placeholder="Tu nombre..."
            />
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="Tu email..."
            />
          </div>

          <div class="form-group">
            <label for="asunto">Asunto</label>
            <select id="asunto" name="asunto">
              <option value="consulta">Consulta general</option>
              <option value="pedido">Estado de mi pedido</option>
              <option value="devolucion">Devoluciones</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="mensaje">Mensaje</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              required
              placeholder="Escribí tu mensaje aquí..."
            ></textarea>
          </div>
          <div class="form-group terminos">
            <label for="conformidad">Acepto los términos y condiciones</label>
            <input
              type="checkbox"
              id="conformidad"
              name="conformidad"
              required
            />
          </div>

          <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Todos los derechos reservados</p>
      <p>Contacto: tienda@katclothes.com.ar</p>
      <div class="rrss">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">Tiktok</a>
      </div>
    </footer>
  </body>
</html>
